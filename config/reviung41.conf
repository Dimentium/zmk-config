# Controller-specific power/BLE options are in config/controllers/.
CONFIG_ZMK_IDLE_TIMEOUT=30000

# --- COMBO SETTINGS ---
CONFIG_ZMK_COMBO_MAX_PRESSED_COMBOS=8

# --- USB SETTINGS ---
CONFIG_ZMK_USB=y
CONFIG_USB_DEVICE_PID=0x641E

# --- ZMK STUDIO (always unlocked) ---
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_POINTING=y
# HID Remapper BLE parser does not support descriptor Push/Pop (issue #335).
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=n
# Disable locking entirely, including boot, idle and disconnect.
CONFIG_ZMK_STUDIO_LOCKING=n
