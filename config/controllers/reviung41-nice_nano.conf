# Reviung41 on nice!nano v2: USB + Bluetooth, battery reporting and idle sleep.
CONFIG_ZMK_BLE=y
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=6000000
CONFIG_ZMK_BATTERY_REPORTING=y

# Use the firmware name, ignoring any old bt/name saved in settings.
CONFIG_BT_DEVICE_NAME="Reviung41"
CONFIG_BT_DEVICE_NAME_DYNAMIC=n
