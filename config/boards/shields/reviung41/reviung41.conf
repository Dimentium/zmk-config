# --- SLEEP SETTINGS ---
# RP2040 has no HAS_POWEROFF support in this ZMK/Zephyr version.
CONFIG_ZMK_SLEEP=n
CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_ZMK_PM_SOFT_OFF=n

# --- COMBO SETTINGS ---
CONFIG_ZMK_COMBO_MAX_PRESSED_COMBOS=8

# --- USB SETTINGS ---
CONFIG_ZMK_BLE=n
CONFIG_USB_DEVICE_PID=0x641E

# --- ZMK STUDIO (always unlocked) ---
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y
# Disable locking entirely, including boot, idle and disconnect.
CONFIG_ZMK_STUDIO_LOCKING=n
